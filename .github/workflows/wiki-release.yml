name: Verified Wiki archive
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing pending Wiki tag
        required: true
        type: string
      public_commit:
        description: Immutable commit already bound to that tag
        required: true
        type: string
  push:
    tags: ['wiki-*']
permissions: {}
concurrency:
  group: wiki-archive-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  archive:
    if: github.event_name == 'push' && github.repository == 'Shiaoming123/nsp-wiki' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Fetch the exact public commit
        env:
          PUBLIC_COMMIT: ${{ github.sha }}
          PUBLIC_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git init --quiet .
          git remote add origin "https://github.com/${PUBLIC_REPOSITORY}.git"
          git fetch --depth=1 origin "${PUBLIC_COMMIT}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${PUBLIC_COMMIT}"
      - name: Verify and publish both complete archive attachments
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_COMMIT: ${{ github.sha }}
          PUBLIC_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/release_archive.py
  recover:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'Shiaoming123/nsp-wiki' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Fetch reviewed implementation and immutable payload
        env:
          IMPLEMENTATION_COMMIT: ${{ github.sha }}
          PUBLIC_REPOSITORY: ${{ github.repository }}
          PAYLOAD_COMMIT: ${{ inputs.public_commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PAYLOAD_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^wiki-[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]
          git init --quiet .
          git remote add origin "https://github.com/${PUBLIC_REPOSITORY}.git"
          git fetch --depth=1 origin "$IMPLEMENTATION_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$IMPLEMENTATION_COMMIT"
          git fetch --depth=1 origin "$PAYLOAD_COMMIT"
          git worktree add --detach "$RUNNER_TEMP/wiki-release-payload" "$PAYLOAD_COMMIT"
          echo "PUBLIC_SOURCE_ROOT=$RUNNER_TEMP/wiki-release-payload" >> "$GITHUB_ENV"
      - name: Publish the unchanged pending tag using the reviewed implementation
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_COMMIT: ${{ inputs.public_commit }}
          PUBLIC_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 .github/scripts/release_archive.py
